{% extends "base.html" %}

{% block mytitle %}Contact Us{% endblock mytitle %}

{% block main %}

<style>
    .main_div {
        margin: 2% 10%;
        padding: 1% 3%;
        background: yellow;
        border: 2px solid;
        border-radius: 18px;
    }

    h2 {
        text-align: center;
        color: red;
        margin-bottom: 22px;
    }

    label { 
        color: red;
    }

    .btn_handel {
        text-align: center;
        padding: 18px 3px;
    }
</style>

<div class="main_div">
    <h2>Contact Us</h2>

    <form action = "/save-contact-us-data" method="post">
        {% csrf_token %} 
        <div>
            <div class="row">
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" name="f_name" class="form-control" placeholder="Enter your first name">
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="l_name" class="form-control" placeholder="enter your last name..">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email address">
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="number" class="form-control" name="p_number" placeholder="enter your phone number..">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-select" aria-label="Default select example" name="gender">
                            <option selected>-- Choose your gender --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="dob" class="form-control" placeholder="choose your dob">
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" placeholder="Enter your address here....">
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" name="msg" rows="3" placeholder="enter your query here..."></textarea>
            </div>

            <div class="btn_handel">
                <button type="submit" class="btn btn-danger">Submit Query</button>
            </div>
        </div>
    </form>

</div>






{% include 'components/learn_comp.html' with xyz="Contact Us" data="My Contact Us Page"%}

{% endblock main %}
