{% extends "base.html" %}

{% block mytitle %}Signup{% endblock mytitle %}


{% block main %}

<style>
    h2 {
        text-align: center;
        margin-bottom: 5%;
        background-color: red;
        color: yellow;
        padding: 1%;
        border-radius: 12px;
    }

    .mysignup {
        padding: 1% 10%;
        background: radial-gradient(#ff0101, #ffffff70);
        margin-top: 2%;
    }

    label {
        display: inline-block;
        color: rgb(221, 255, 0);
    }

    .my_inner{
        background-color: red;
    padding: 2%;
    border-radius: 14px;
    }
</style>

<div style="margin: 2% 24%; border: 4px solid; padding: 1%; border-radius: 14px; background-color: yellow;">
    <h2>SignUp Here</h2>

    <form action="/auth/sign-up" method="post">
        {% csrf_token %}
        <div class="my_inner">
            <div class="row">
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" name="f_name" class="form-control" placeholder="enter your first name...">
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="l_name" class="form-control" placeholder="enter your last name..">
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name = "u_name" class="form-control" placeholder="set a unique usernmae..">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="em" class="form-control" placeholder="set a uique email address">
            </div>

            <div class="row">
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="passw" class="form-control" placeholder="create your strong password..">
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="c_p" class="form-control" placeholder="Verify the password..">
                    </div>
                </div>
            </div>

            <div style="text-align: center;">
                <button type="submit" class="btn btn-danger mysignup">Signup</button>
            </div>

        </div>
    </form>
</div>


{% endblock main %}
