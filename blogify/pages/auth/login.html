
{% extends "base.html" %}

{% block mytitle %}login{% endblock mytitle %}


{% block main %}


<style>
    h2 {
        text-align: center;
        margin-bottom: 5%;
        background-color: rgb(4, 171, 1);
        color: yellow;
        padding: 1%;
        border-radius: 12px;
    }

    .mysignup {
        padding: 1% 10%;
        background: radial-gradient(#178601, #ffffff70);
        margin-top: 2%;
    }

    label {
        display: inline-block;
        color: rgb(255, 251, 0);
    }
    .my_inner{
        background-color:  rgb(4, 171, 1);
    padding: 2%;
    border-radius: 14px;
    }
</style>

<div style="margin: 2% 24%; border: 4px solid; padding: 1%; border-radius: 14px; background-color: yellow;">
    <h2>Login Here</h2>

    <form action="/auth/login" method="post">
        {% csrf_token %}
        <div class="my_inner">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name = "u_name" class="form-control" placeholder="enter username..">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="passw" class="form-control" placeholder="enter password..">
            </div>

            <div style="text-align: center;">
                <button type="submit" class="btn btn-danger mysignup">Click to Login</button>
            </div>

        </div>
    </form>
</div>


{% endblock main %}
